- id: systems
  title: Systems and software
  era: "1968 – today"
  track: stack
  stack: classical
  blurb: >-
    Operating systems, databases, compilers, kernels and distributed systems: the software that decides what the
    hardware actually does, from one core to a datacenter.
  items:
    - title: "A Study of Replacement Algorithms for a Virtual-Storage Computer"
      by: László Bélády
