# ---------------------------------------------------------------- chapter: Experiments & evidence

- title: "Adding Error Bars to Evals: A Statistical Approach to Language Model Evaluations"
  by: Evan Miller
  year: 2024
  kind: paper
  url: https://arxiv.org/abs/2411.00640
  home: evidence
  layer: learning
  does: [search]
  note: "Evaluations are experiments, so treat them as such: standard errors, clustered questions, paired comparisons and power analysis for language model evals."
  focus: "Take a benchmark score of 72% on 500 questions. Compute its standard error, then say how many questions you need to tell 72% from 74% reliably."

- title: "Deep Reinforcement Learning that Matters"
  by: Peter Henderson et al.
  year: 2018
  kind: paper
  url: https://arxiv.org/abs/1709.06560
  home: evidence
  layer: learning
  does: [search]
  builds_on:
    - "Human-Level Control Through Deep Reinforcement Learning"
  note: "Random seeds, implementations and hyperparameters can move RL results more than the method being proposed. A field-wide reproducibility check."
  focus: "Pick one of the paper's figures where seeds alone separate the curves. Say how many runs you would need before claiming one method beats another."

- title: "Do ImageNet Classifiers Generalize to ImageNet?"
  by: Benjamin Recht, Rebecca Roelofs, Ludwig Schmidt, Vaishaal Shankar
  year: 2019
  kind: paper
  url: https://arxiv.org/abs/1902.10811
  home: evidence
  layer: learning
  does: [search]
  builds_on:
    - "ImageNet Classification with Deep Convolutional Neural Networks"
  note: "Rebuild the ImageNet test set from scratch and accuracy drops by 11 to 14 points, yet the ranking of models barely changes. What a benchmark does and does not measure."
  focus: "Say why the models lost accuracy but kept their order. Decide whether that is evidence of overfitting to the test set, and what would distinguish the two explanations."

- title: "Show Your Work: Improved Reporting of Experimental Results"
  by: Jesse Dodge et al.
  year: 2019
  kind: paper
  url: https://arxiv.org/abs/1909.03004
  home: evidence
  layer: learning
  does: [compute]
  note: "Report expected validation performance as a function of the tuning budget, not a single best number. Which model wins depends on how much search you can afford."
  focus: "Sketch expected best accuracy against number of tuning trials for two models whose curves cross. Say which one you would report as better, and why that depends on budget."

- title: "Shortcut Learning in Deep Neural Networks"
  by: Robert Geirhos et al.
  year: 2020
  kind: paper
  url: https://arxiv.org/abs/2004.07780
  home: evidence
  layer: learning
  does: [compute]
  builds_on:
    - "ImageNet-trained CNNs are biased towards texture; increasing shape bias improves accuracy and robustness"
  note: "Models solve benchmarks with decision rules that fail out of distribution: watermarks, backgrounds, texture. A catalogue of how high scores can mislead."
  focus: "Pick one example from the paper. Design an out-of-distribution test that the shortcut would fail and the intended solution would pass."

- title: "Accounting for Variance in Machine Learning Benchmarks"
  by: Xavier Bouthillier et al.
  year: 2021
  kind: paper
  url: https://arxiv.org/abs/2103.03098
  home: evidence
  layer: learning
  does: [compute]
  builds_on:
    - "Show Your Work: Improved Reporting of Experimental Results"
  note: "Data splits, initialisation, data order and hyperparameter search all add variance to a benchmark result. Randomise more of them and you need fewer runs to draw a reliable conclusion."
  focus: "List the sources of variance the paper measures. For one experiment of your own, say which of them you would randomise and which you would hold fixed."

- title: "Holistic Evaluation of Language Models"
  by: Percy Liang et al.
  year: 2022
  kind: paper
  url: https://arxiv.org/abs/2211.09110
  home: evidence
  layer: learning
  does: [search]
  builds_on:
    - "Language Models are Few-Shot Learners"
  note: "Evaluate language models on many scenarios and many metrics at once, including calibration, robustness and efficiency, under one standard protocol."
  focus: "Pick two models and two metrics where the models swap ranks. Say what that implies about reporting a single leaderboard number."

- title: "Leakage and the Reproducibility Crisis in Machine-Learning-Based Science"
  by: Sayash Kapoor, Arvind Narayanan
  year: 2023
  kind: paper
  url: https://doi.org/10.1016/j.patter.2023.100804
  home: evidence
  layer: learning
  does: [search]
  builds_on:
