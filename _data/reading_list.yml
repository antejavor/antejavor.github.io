      note: "Dataflows, data reuse and accelerator design. Also available as an expanded book."
      route: 28

    - title: "Computer Architecture: A Quantitative Approach"
      by: John Hennessy, David Patterson
      year: 2017
      kind: book
      url: https://shop.elsevier.com/books/computer-architecture/hennessy/978-0-12-811905-1
      layer: architecture
      does: [compute, store, move]
      builds_on:
        - "Reduced Instruction Set Computers"
      note: "The reference text. The domain-specific architecture chapter covers TPUs and GPUs."

    - title: "Processing Data Where It Makes Sense: Enabling In-Memory Computation"
      by: Onur Mutlu et al.
      year: 2019
      kind: paper
      url: https://arxiv.org/abs/1903.03988
      layer: architecture
      does: [compute, store]
      builds_on:
        - "A Case for Intelligent RAM"
      note: "The modern case for processing-in-memory, with the data-movement energy numbers behind it."

    - title: "A New Golden Age for Computer Architecture"
      by: John Hennessy, David Patterson
      year: 2019
      kind: paper
      url: https://cacm.acm.org/research/a-new-golden-age-for-computer-architecture/
      core: true
      layer: architecture
      does: [compute]
      builds_on:
        - "Reduced Instruction Set Computers"
        - "In-Datacenter Performance Analysis of a Tensor Processing Unit"
        - "Dark Silicon and the End of Multicore Scaling"
      note: "With Moore's law and Dennard scaling over, domain-specific hardware is the way forward."

    - title: "A Primer on Memory Consistency and Cache Coherence"
      by: Vijay Nagarajan, Daniel Sorin, Mark Hill, David Wood
