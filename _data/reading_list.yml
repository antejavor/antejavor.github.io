- id: science
  title: Computing the physical world
  era: "1922 – today"
  track: science
  stack: classical
  blurb: >-
    Simulation drove computing long before AI did: weather on ENIAC, Monte Carlo at Los Alamos, molecular dynamics
    on GPUs. The numerical methods and machines behind it, and where learning now joins in.
  items:
    - title: "Weather Prediction by Numerical Process"
      by: Lewis Fry Richardson
      year: 1922
      kind: book
      url: https://doi.org/10.1017/CBO9780511618291
      core: true
      layer: algorithms
      does: [compute]
      note: "The first numerical weather forecast, by hand, with a vision of 64,000 human computers in a hall. Computation as a way to know the physical world."

    - title: "On the Partial Difference Equations of Mathematical Physics"
      by: Richard Courant, Kurt Friedrichs, Hans Lewy
      year: 1928
      kind: paper
      url: https://doi.org/10.1147/rd.112.0215
      layer: algorithms
      does: [compute]
      note: "The CFL condition: information must not travel faster in the simulation than in the physics. (English translation, 1967.)"

    - title: "Numerical Integration of the Barotropic Vorticity Equation"
      by: Jule Charney, Ragnar Fjørtoft, John von Neumann
      year: 1950
      kind: paper
