    - title: "Validity of the Single Processor Approach to Achieving Large Scale Computing Capabilities"
      by: Gene Amdahl
      year: 1967
      kind: paper
      url: https://doi.org/10.1145/1465482.1465560
      layer: architecture
      does: [compute]
      note: "Amdahl's law in three pages. The serial part always wins in the end."

    - title: "An Efficient Algorithm for Exploiting Multiple Arithmetic Units"
      by: Robert Tomasulo
      year: 1967
      kind: paper
      url: https://doi.org/10.1147/rd.111.0025
      layer: architecture
      does: [compute]
      note: "Out-of-order execution with register renaming. Nearly every fast CPU core today runs this algorithm in hardware."

    - title: "Can Programming Be Liberated from the von Neumann Style?"
      by: John Backus
      year: 1978
      kind: paper
      url: https://dl.acm.org/doi/10.1145/359576.359579
      layer: architecture
      does: [move]
      builds_on:
        - "First Draft of a Report on the EDVAC"
      note: "The Turing Award lecture that named the 'von Neumann bottleneck', the problem neuromorphic and in-memory computing try to remove."

    - title: "The CRAY-1 Computer System"
      by: Richard Russell
      year: 1978
      kind: paper
      url: https://doi.org/10.1145/359327.359336
      layer: architecture
      does: [compute, move]
      builds_on:
        - "Very High-Speed Computing Systems"
      note: "Vector registers and chaining: the supercomputer built for physics, and the GPU's ancestor."

    - title: "How to Make a Multiprocessor Computer That Correctly Executes Multiprocess Programs"
      by: Leslie Lamport
      year: 1979
      kind: paper
      url: https://doi.org/10.1109/TC.1979.1675439
      layer: architecture
      does: [store]
      builds_on:
        - "Time, Clocks, and the Ordering of Events in a Distributed System"
      note: "Defines sequential consistency in two pages. Every memory model since is measured against it."

    - title: "Why Systolic Architectures?"
      by: H. T. Kung
      year: 1982
      kind: paper
      url: https://doi.org/10.1109/MC.1982.1653825
      core: true
      layer: architecture
      does: [compute, move]
      builds_on:
        - "Introduction to VLSI Systems"
      note: "Data pumped rhythmically through a grid of cells. Thirty-five years later it is the heart of the TPU."

    - title: "The Connection Machine"
      by: W. Daniel Hillis
      year: 1985
      kind: book
      url: https://dspace.mit.edu/handle/1721.1/14719
      layer: architecture
      does: [compute, move]
      builds_on:
        - "Can Programming Be Liberated from the von Neumann Style?"
      note: "Sixty-four thousand tiny processors connected as a hypercube, designed for AI. The massively parallel idea, decades early."

    - title: "Reduced Instruction Set Computers"
      by: David Patterson
      year: 1985
      kind: paper
      url: https://doi.org/10.1145/2465.214917
      layer: architecture
      does: [compute]
      builds_on:
        - "Introduction to VLSI Systems"
      note: "Simple instructions, pipelined fast. The design idea behind ARM and RISC-V, and your Mac."

    - title: "Fat-Trees: Universal Networks for Hardware-Efficient Supercomputing"
      by: Charles Leiserson
      year: 1985
      kind: paper
      url: https://doi.org/10.1109/TC.1985.6312192
      layer: architecture
      does: [move]
      note: "An interconnect whose bandwidth grows toward the root. The topology of most datacenter and GPU-cluster networks."

    - title: "Hitting the Memory Wall"
      by: Wm. Wulf, Sally McKee
      year: 1995
      kind: paper
      url: https://doi.org/10.1145/216585.216588
      layer: architecture
      does: [store, move]
      builds_on:
        - "Slave Memories and Dynamic Storage Allocation"
      note: "Processor speed outpacing memory, predicted early. Today's LLM inference is exactly this problem."

    - title: "A Case for Intelligent RAM"
      by: David Patterson et al.
      year: 1997
      kind: paper
      url: https://doi.org/10.1109/40.592312
      layer: architecture
      does: [compute, store]
      builds_on:
        - "Hitting the Memory Wall"
      note: "Put the processor on the DRAM chip. Processing-in-memory, argued early."

    - title: "What Every Programmer Should Know About Memory"
      by: Ulrich Drepper
      year: 2007
      kind: essay
      url: https://akkadia.org/drepper/cpumemory.pdf
      core: true
      layer: architecture
      does: [store, move]
      builds_on:
        - "Hitting the Memory Wall"
        - "Slave Memories and Dynamic Storage Allocation"
      note: "DRAM, caches, TLBs and NUMA from the hardware up, with measurements. The engineer's classic."
