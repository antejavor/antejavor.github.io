# All the way down and around: the data behind /down-and-around/.
#
# The list is organised around the stack: physics -> devices -> architecture -> systems -> algorithms -> learning
# -> intelligence, and around four questions every layer answers: how to compute, store, move and search.
# There are three stacks: classical (transistors to GPUs), brain (neurons to neuromorphic chips) and quantum.
# Stages are walked roughly in order; tracks let you cut across them. Items within a stage are kept in year order.
#
# stage fields: id, title, era, track, stack (classical | brain | quantum), blurb
#
# item fields:
#   title, by, year, kind (paper | book | course | essay | video | interactive), url
#   core: true       -> the "if you only read one thing here" picks
#   layer: ...       -> physics | devices | architecture | systems | algorithms | learning | intelligence
#   does: [...]      -> any of compute, store, move, search (empty for purely conceptual items)
#   stack: ...       -> only when it differs from the stage's stack
#   builds_on: [...] -> exact titles of earlier items this one builds on; drawn as connections on the map
#   note             -> why it is on the list (kept for reference; not shown on the page)
#   question: "..."  -> a question to carry while reading (not shown on the page)
#   route: 7         -> position on the suggested cross-track route (dashed line on the map)
#   read: 2026-11-20 -> add when done; the walked line on the map follows these dates
#
# tracks: foundations, theory, stack, science, learning, graphs, vision, control, brain, quantum, crossroads

- id: orientation
  title: Orientation
  era: "start here"
  track: foundations
  stack: classical
  blurb: >-
    Big-picture reading before any equations: a map of the field, of the stack underneath it, and a sense of why
    each later stage matters.
  items:
    - title: "Computing Machinery and Intelligence"
      by: Alan Turing
      year: 1950
      kind: paper
      url: https://academic.oup.com/mind/article/LIX/236/433/986238
      core: true
      layer: intelligence
      does: []
      builds_on:
        - "On Computable Numbers, with an Application to the Entscheidungsproblem"
      note: "The imitation game, plus a section on 'learning machines' that anticipates most of this list."

    - title: "The Sciences of the Artificial"
      by: Herbert Simon
      year: 1969
      kind: book
      url: https://doi.org/10.7551/mitpress/12107.001.0001
      core: true
      layer: intelligence
      does: []
      builds_on:
        - "Cybernetics: Or Control and Communication in the Animal and the Machine"
      note: "Includes 'The Architecture of Complexity': why complex systems are built as nearly decomposable hierarchies. The stack idea itself."

    - title: "The Art of Doing Science and Engineering"
      by: Richard Hamming
      year: 1997
      kind: book
      url: https://press.stripe.com/the-art-of-doing-science-and-engineering
      core: true
      layer: intelligence
      does: []
      note: "Hamming's course on how to do great work: style, foresight and taste, from someone who did it. The craftsman's orientation."

    - title: "The Pattern on the Stone"
      by: W. Daniel Hillis
      year: 1998
      kind: book
      url: https://www.basicbooks.com/titles/w-daniel-hillis/the-pattern-on-the-stone/9780465066933/
      core: true
      layer: architecture
      does: [compute, store]
      builds_on:
        - "A Symbolic Analysis of Relay and Switching Circuits"
        - "On Computable Numbers, with an Application to the Entscheidungsproblem"
      note: "The whole stack in 160 pages, from logic and Boolean switches to parallel machines, learning and emergence. The best first map of what lies underneath."

    - title: "The Deep Learning Revolution"
      by: Terrence Sejnowski
      year: 2018
      kind: book
      url: https://mitpress.mit.edu/9780262038034/the-deep-learning-revolution/
      layer: learning
      does: [compute]
      note: "An insider history, from the Boltzmann machine to the GPU era, by someone who was in the room."

    - title: "The Bitter Lesson"
      by: Richard Sutton
      year: 2019
      kind: essay
      url: http://www.incompleteideas.net/IncIdeas/BitterLesson.html
      core: true
      layer: intelligence
      does: [compute, search]
      builds_on:
        - "Programming a Computer for Playing Chess"
        - "A General Reinforcement Learning Algorithm That Masters Chess, Shogi, and Go Through Self-Play"
        - "ImageNet Classification with Deep Convolutional Neural Networks"
      note: "One page. General methods that scale with compute have won, again and again. Keep it in mind for the whole list, then argue with it."

    - title: "Code: The Hidden Language of Computer Hardware and Software"
      by: Charles Petzold
      year: 2022
      kind: book
      url: https://www.charlespetzold.com/code/
      layer: architecture
      does: [compute, store]
      builds_on:
        - "A Symbolic Analysis of Relay and Switching Circuits"
      note: "From Morse code and relays to a working CPU, built up one idea at a time. The craftsman's companion to Nand2Tetris."

    - title: "A Brief History of Intelligence"
      by: Max Bennett
      year: 2023
      kind: book
      url: https://www.abriefhistoryofintelligence.com/
      core: true
      layer: intelligence
      does: []
      builds_on:
        - "Reinforcement Learning: An Introduction"
        - "A Neural Substrate of Prediction and Reward"
      note: "The evolution of the brain told as five breakthroughs, each mapped onto AI. A good bridge between neuroscience and machine learning."

- id: origins
  title: Origins
  era: "1943 – 1990"
  track: foundations
  stack: classical
  blurb: >-
    Logic, information and the first artificial neurons. Most of today's ideas were already in these papers,
    waiting for data and hardware.
  items:
    - title: "A Logical Calculus of the Ideas Immanent in Nervous Activity"
      by: Warren McCulloch, Walter Pitts
      year: 1943
      kind: paper
      url: https://link.springer.com/article/10.1007/BF02478259
      core: true
      layer: learning
      does: [compute]
      builds_on:
        - "On Computable Numbers, with an Application to the Entscheidungsproblem"
      note: "The first formal neuron: a threshold unit computing logic. Neural networks and the brain started out as one idea."
      route: 1

    - title: "A Mathematical Theory of Communication"
      by: Claude Shannon
      year: 1948
      kind: paper
      url: https://people.math.harvard.edu/~ctm/home/text/others/shannon/entropy/entropy.pdf
      core: true
      layer: algorithms
      does: [move]
      note: "Entropy, coding and n-gram language models. Cross-entropy loss and next-token prediction come straight from here."
      route: 4

    - title: "The Organization of Behavior"
      by: Donald Hebb
      year: 1949
      kind: book
      url: https://en.wikipedia.org/wiki/Hebbian_theory
      layer: learning
      does: [store]
      note: "'Cells that fire together wire together.' The local learning rule that neuromorphic chips still use."

    - title: "The Perceptron: A Probabilistic Model for Information Storage and Organization in the Brain"
      by: Frank Rosenblatt
      year: 1958
      kind: paper
      url: https://psycnet.apa.org/doi/10.1037/h0042519
      core: true
      layer: learning
      does: [compute]
      builds_on:
        - "A Logical Calculus of the Ideas Immanent in Nervous Activity"
        - "The Organization of Behavior"
      note: "The first learning machine, built as custom hardware (the Mark I). Hardware and AI have been linked from the start."

    - title: "Adaptive Switching Circuits"
      by: Bernard Widrow, Marcian Hoff
      year: 1960
      kind: paper
      url: https://isl.stanford.edu/~widrow/papers/c1960adaptiveswitching.pdf
      layer: devices
      does: [compute]
      builds_on:
        - "The Perceptron: A Probabilistic Model for Information Storage and Organization in the Brain"
      note: "ADALINE and the LMS rule: gradient descent on squared error, built in hardware. The direct ancestor of SGD."

    - title: "Perceptrons"
      by: Marvin Minsky, Seymour Papert
      year: 1969
      kind: book
      url: https://mitpress.mit.edu/9780262630221/perceptrons/
      layer: learning
      does: [compute]
      builds_on:
        - "The Perceptron: A Probabilistic Model for Information Storage and Organization in the Brain"
      note: "The limits of single-layer networks, and the book usually blamed for the first AI winter. Read the 1988 epilogue too."

    - title: "Neocognitron"
      by: Kunihiko Fukushima
      year: 1980
      kind: paper
      url: https://doi.org/10.1007/BF00344251
      layer: learning
      does: [compute]
      builds_on:
        - "Receptive Fields, Binocular Interaction and Functional Architecture in the Cat's Visual Cortex"
      note: "Hubel and Wiesel's cells turned into a layered network. Convolution and pooling, a decade before LeNet."

    - title: "Neural Networks and Physical Systems with Emergent Collective Computational Abilities"
      by: John Hopfield
      year: 1982
      kind: paper
      url: https://www.pnas.org/doi/10.1073/pnas.79.8.2554
      core: true
      layer: learning
      does: [store]
      builds_on:
        - "The Organization of Behavior"
        - "A Logical Calculus of the Ideas Immanent in Nervous Activity"
      note: "Memory as an energy landscape. It brought physics into neural networks and won the 2024 Nobel Prize in physics."
      route: 15

    - title: "A Learning Algorithm for Boltzmann Machines"
      by: David Ackley, Geoffrey Hinton, Terrence Sejnowski
      year: 1985
      kind: paper
      url: https://doi.org/10.1207/s15516709cog0901_7
      layer: learning
      does: [compute, search]
      builds_on:
        - "Neural Networks and Physical Systems with Emergent Collective Computational Abilities"
        - "Equation of State Calculations by Fast Computing Machines"
        - "Optimization by Simulated Annealing"
      note: "A stochastic Hopfield network that learns hidden units with statistical mechanics. Energy-based models start here."

    - title: "Learning Representations by Back-Propagating Errors"
      by: David Rumelhart, Geoffrey Hinton, Ronald Williams
      year: 1986
      kind: paper
      url: https://www.nature.com/articles/323533a0
      core: true
      layer: learning
      does: [compute]
      builds_on:
        - "The Perceptron: A Probabilistic Model for Information Storage and Organization in the Brain"
        - "Perceptrons"
      note: "Backpropagation, short and clear. Every model on this list is trained with it."
      route: 13

    - title: "Finding Structure in Time"
      by: Jeffrey Elman
      year: 1990
      kind: paper
      url: https://doi.org/10.1207/s15516709cog1402_1
      layer: learning
      does: [store]
      builds_on:
        - "Learning Representations by Back-Propagating Errors"
      note: "The simple recurrent network discovers word boundaries and categories from prediction alone, the idea later scaled into LLMs."

- id: math
  title: The mathematical toolkit
  era: "ongoing"
  track: foundations
  stack: classical
  blurb: >-
    Linear algebra, probability, optimization, dynamics and learning theory. Learn just enough, then come back
    whenever a paper loses you.
  items:
    - title: "Maximum Likelihood from Incomplete Data via the EM Algorithm"
      by: Arthur Dempster, Nan Laird, Donald Rubin
      year: 1977
      kind: paper
      url: https://doi.org/10.1111/j.2517-6161.1977.tb01600.x
      layer: learning
      does: [search]
      note: "EM: learning with hidden variables by alternating inference and fitting. The template behind VAEs and much of unsupervised learning."

    - title: "A Theory of the Learnable"
      by: Leslie Valiant
      year: 1984
      kind: paper
      url: https://doi.org/10.1145/1968.1972
      layer: learning
      does: [compute]
      note: "PAC learning: what it means, formally, for a machine to learn from examples."

    - title: "Approximation by Superpositions of a Sigmoidal Function"
      by: George Cybenko
      year: 1989
      kind: paper
      url: https://doi.org/10.1007/BF02551274
      layer: learning
      does: [compute]
      note: "The universal approximation theorem. Know exactly what it does and does not promise."

    - title: "The Nature of Statistical Learning Theory"
      by: Vladimir Vapnik
      year: 1995
      kind: book
      url: https://doi.org/10.1007/978-1-4757-3264-1
      layer: learning
      does: [compute]
      note: "VC dimension, capacity and generalisation; the theory behind SVMs and kernel methods."

    - title: "Support-Vector Networks"
      by: Corinna Cortes, Vladimir Vapnik
      year: 1995
      kind: paper
      url: https://doi.org/10.1007/BF00994018
      layer: learning
      does: [compute]
      builds_on:
        - "The Perceptron: A Probabilistic Model for Information Storage and Organization in the Brain"
        - "The Nature of Statistical Learning Theory"
      note: "Maximum-margin classifiers and the kernel trick. Needed to understand quantum kernels and the neural tangent kernel."

    - title: "Statistical Modeling: The Two Cultures"
      by: Leo Breiman
      year: 2001
      kind: paper
      url: https://doi.org/10.1214/ss/1009213726
      layer: learning
      does: []
      note: "Data models versus algorithmic models: the argument that predictive accuracy can matter more than interpretable assumptions."

    - title: "Information Theory, Inference, and Learning Algorithms"
      by: David MacKay
      year: 2003
      kind: book
      url: https://www.inference.org.uk/itprnn/book.html
      does: []
      builds_on:
        - "A Mathematical Theory of Communication"
      note: "Free. Information theory and learning as one subject. Read it after Shannon."
      route: 5

    - title: "Probability Theory: The Logic of Science"
      by: E. T. Jaynes
      year: 2003
      kind: book
      url: https://doi.org/10.1017/CBO9780511790423
      does: []
      note: "Probability as extended logic. Opinionated and deep; it changes how you read every Bayesian argument afterwards."

    - title: "Convex Optimization"
      by: Stephen Boyd, Lieven Vandenberghe
      year: 2004
      kind: book
      url: https://web.stanford.edu/~boyd/cvxbook/
      does: []
      note: "Free. Objectives, constraints and duality. Training is non-convex, but this is the language optimisation is described in."

    - title: "Pattern Recognition and Machine Learning"
      by: Christopher Bishop
      year: 2006
      kind: book
      url: https://www.microsoft.com/en-us/research/publication/pattern-recognition-machine-learning/
      does: []
      note: "The probabilistic view of ML: Bayesian methods, graphical models, kernels. Still the reference."

    - title: "Elements of Information Theory"
      by: Thomas Cover, Joy Thomas
      year: 2006
      kind: book
      url: https://doi.org/10.1002/047174882X
      does: []
      builds_on:
        - "A Mathematical Theory of Communication"
      note: "The rigorous companion to MacKay: entropy, mutual information, channel capacity, rate–distortion."

    - title: "Essence of Linear Algebra & Neural Networks series"
      by: Grant Sanderson (3Blue1Brown)
      year: 2016
      kind: video
      url: https://www.3blue1brown.com/topics/neural-networks
      core: true
      does: []
      note: "The best intuition for vectors, matrices, gradients and attention you will find. Watch before the textbooks."

    - title: "Nonlinear Dynamics and Chaos"
      by: Steven Strogatz
      year: 2018
      kind: book
      url: https://doi.org/10.1201/9780429492563
      does: []
      note: "Fixed points, stability, bifurcations, oscillators. The prerequisite for neurons, control, Hopfield networks and state-space models."

    - title: "Linear Algebra and Learning from Data"
      by: Gilbert Strang
      year: 2019
      kind: book
      url: https://math.mit.edu/~gs/learningfromdata/
      does: []
      note: "Strang's linear algebra aimed at deep learning, with the MIT 18.065 lectures online."

    - title: "Mathematics for Machine Learning"
      by: Marc Deisenroth, Aldo Faisal, Cheng Soon Ong
      year: 2020
      kind: book
      url: https://mml-book.github.io/
      core: true
      does: []
      note: "Free. Exactly the math the rest of this list assumes, and no more."
      route: 6

    - title: "Probabilistic Machine Learning: An Introduction"
      by: Kevin Murphy
      year: 2022
      kind: book
      url: https://probml.github.io/pml-book/book1.html
      does: []
      note: "Free. The probabilistic modelling view in depth, so not every problem looks like an architecture choice."

- id: computation
  title: Computation
  era: "1936 – today"
  track: theory
  stack: classical
  blurb: >-
    What can be computed, how much it costs in time, space and data movement, and how to reason about it. The
    theory under every layer of every stack.
  items:
    - title: "On Computable Numbers, with an Application to the Entscheidungsproblem"
      by: Alan Turing
      year: 1936
      kind: paper
      url: https://doi.org/10.1112/plms/s2-42.1.230
      core: true
      layer: algorithms
      does: [compute]
      note: "The Turing machine and the limits of computation. Everything else on this list runs inside this definition."
      route: 2

    - title: "An Unsolvable Problem of Elementary Number Theory"
      by: Alonzo Church
      year: 1936
      kind: paper
      url: https://doi.org/10.2307/2371045
      layer: algorithms
      does: [compute]
      note: "The lambda calculus and the first undecidability result. Turing's equivalent, and the root of functional programming."

    - title: "Communication in the Presence of Noise"
      by: Claude Shannon
      year: 1949
      kind: paper
      url: https://doi.org/10.1109/JRPROC.1949.232969
      layer: algorithms
      does: [move]
      builds_on:
        - "A Mathematical Theory of Communication"
      note: "The sampling theorem and channel capacity with noise, in geometric form. How continuous signals become bits."

    - title: "Error Detecting and Error Correcting Codes"
      by: Richard Hamming
      year: 1950
      kind: paper
      url: https://doi.org/10.1002/j.1538-7305.1950.tb00463.x
      core: true
      layer: algorithms
      does: [store, move]
      builds_on:
        - "A Mathematical Theory of Communication"
      note: "The first practical error-correcting codes. Reliable storage and transmission from unreliable parts, and the ancestor of quantum error correction."

    - title: "A Method for the Construction of Minimum-Redundancy Codes"
      by: David Huffman
      year: 1952
      kind: paper
      url: https://doi.org/10.1109/JRPROC.1952.273898
      layer: algorithms
      does: [store]
      builds_on:
        - "A Mathematical Theory of Communication"
      note: "Optimal prefix codes, as a term paper. Compression meets Shannon's entropy bound."

    - title: "Finite Automata and Their Decision Problems"
      by: Michael Rabin, Dana Scott
      year: 1959
      kind: paper
      url: https://doi.org/10.1147/rd.32.0114
      layer: algorithms
      does: [compute, store]
      builds_on:
        - "A Logical Calculus of the Ideas Immanent in Nervous Activity"
      note: "Nondeterminism and the subset construction. The simplest machines with memory, and what they can't do."

    - title: "On the Computational Complexity of Algorithms"
      by: Juris Hartmanis, Richard Stearns
      year: 1965
      kind: paper
      url: https://doi.org/10.1090/S0002-9947-1965-0170805-7
      layer: algorithms
      does: [compute]
      builds_on:
        - "On Computable Numbers, with an Application to the Entscheidungsproblem"
      note: "Founds complexity theory: measure computation by the time and space it uses."

    - title: "Three Approaches to the Quantitative Definition of Information"
      by: Andrey Kolmogorov
      year: 1965
      kind: paper
      url: https://doi.org/10.1080/00207166808803030
      core: true
      layer: algorithms
      does: [store]
      builds_on:
        - "A Mathematical Theory of Communication"
        - "On Computable Numbers, with an Application to the Entscheidungsproblem"
      note: "Information as the length of the shortest program that produces a string. Compression, induction and learning meet here."

    - title: "The Complexity of Theorem-Proving Procedures"
      by: Stephen Cook
      year: 1971
      kind: paper
      url: https://doi.org/10.1145/800157.805047
      core: true
      layer: algorithms
      does: [search]
      builds_on:
        - "On the Computational Complexity of Algorithms"
      note: "SAT is NP-complete. The P vs NP question starts here."

    - title: "Reducibility Among Combinatorial Problems"
      by: Richard Karp
      year: 1972
      kind: paper
      url: https://doi.org/10.1007/978-1-4684-2001-2_9
      layer: algorithms
      does: [search]
      builds_on:
        - "The Complexity of Theorem-Proving Procedures"
      note: "Twenty-one problems shown NP-complete, many of them on graphs: clique, colouring, Hamiltonian cycle."

    - title: "A Universal Algorithm for Sequential Data Compression"
      by: Jacob Ziv, Abraham Lempel
      year: 1977
      kind: paper
      url: https://doi.org/10.1109/TIT.1977.1055714
      layer: algorithms
      does: [store]
      builds_on:
        - "A Method for the Construction of Minimum-Redundancy Codes"
        - "Three Approaches to the Quantitative Definition of Information"
      note: "LZ77: compression that learns its dictionary from the data itself. Inside gzip, and a working form of Kolmogorov's idea."

    - title: "I/O Complexity: The Red-Blue Pebble Game"
      by: Jia-Wei Hong, H. T. Kung
      year: 1981
      kind: paper
      url: https://doi.org/10.1145/800076.802486
      core: true
      layer: algorithms
      does: [move]
      builds_on:
        - "On the Computational Complexity of Algorithms"
      note: "Lower bounds on data movement between fast and slow memory. The theory behind tiling, and behind FlashAttention."
      route: 25

    - title: "Structure and Interpretation of Computer Programs"
      by: Harold Abelson, Gerald Jay Sussman
      year: 1985
      kind: book
      url: https://web.mit.edu/6.001/6.037/sicp.pdf
      core: true
      layer: algorithms
      does: [compute, store]
      builds_on:
        - "An Unsolvable Problem of Elementary Number Theory"
      note: "Programs as a medium for expressing ideas: abstraction, state, interpreters and the environment model. The artisan's computer science."

    - title: "The Input/Output Complexity of Sorting and Related Problems"
      by: Alok Aggarwal, Jeffrey Vitter
      year: 1988
      kind: paper
      url: https://doi.org/10.1145/48529.48535
      layer: algorithms
      does: [move, store]
      builds_on:
        - "I/O Complexity: The Red-Blue Pebble Game"
      note: "The external-memory model: count block transfers, not operations. The cost model databases live by."

    - title: "Quantum Complexity Theory"
      by: Ethan Bernstein, Umesh Vazirani
      year: 1997
      kind: paper
      url: https://doi.org/10.1137/S0097539796300921
      core: true
      layer: algorithms
      does: [compute]
      stack: quantum
      builds_on:
        - "Quantum Theory, the Church–Turing Principle and the Universal Quantum Computer"
        - "On the Computational Complexity of Algorithms"
      note: "Defines BQP and the quantum Turing machine: the class of problems quantum computers solve efficiently."
      route: 47

    - title: "Cache-Oblivious Algorithms"
      by: Matteo Frigo, Charles Leiserson, Harald Prokop, Sridhar Ramachandran
      year: 1999
      kind: paper
      url: https://doi.org/10.1109/SFFCS.1999.814600
      layer: algorithms
      does: [move]
      builds_on:
        - "The Input/Output Complexity of Sorting and Related Problems"
      note: "Recursive algorithms that are efficient at every level of the hierarchy without knowing its sizes."

    - title: "Computational Complexity: A Modern Approach"
      by: Sanjeev Arora, Boaz Barak
      year: 2009
      kind: book
      url: https://theory.cs.princeton.edu/complexity/
      layer: algorithms
      does: [compute]
      note: "Graduate-level complexity, including randomness, interactive proofs and quantum computation. Free draft online."

    - title: "The Nature of Computation"
      by: Cristopher Moore, Stephan Mertens
      year: 2011
      kind: book
      url: https://doi.org/10.1093/acprof:oso/9780199233212.001.0001
      core: true
      layer: algorithms
      does: [compute, search]
      builds_on:
        - "On Computable Numbers, with an Application to the Entscheidungsproblem"
        - "The Complexity of Theorem-Proving Procedures"
      note: "Complexity, algorithms, phase transitions and quantum computation in one book written by physicists. The best single map of this stage."
      route: 7

    - title: "Introduction to the Theory of Computation"
      by: Michael Sipser
      year: 2012
      kind: book
      url: https://math.mit.edu/~sipser/book.html
      layer: algorithms
      does: [compute]
      note: "The standard text on automata, computability and complexity. Clear enough to work through alone."

- id: search
  title: Search
  era: "1950 – today"
  track: theory
  stack: classical
  blurb: >-
    Finding things: paths, moves, solutions, documents, nearest neighbours. Search and learning are the two
    methods that scale with compute; this is the half that usually gets skipped.
  items:
    - title: "Programming a Computer for Playing Chess"
      by: Claude Shannon
      year: 1950
      kind: paper
      url: https://doi.org/10.1080/14786445008521796
      layer: algorithms
      does: [search]
      note: "Minimax, evaluation functions and the size of the game tree, laid out before anyone had a computer to try it on."

    - title: "A Stochastic Approximation Method"
      by: Herbert Robbins, Sutton Monro
      year: 1951
      kind: paper
      url: https://doi.org/10.1214/aoms/1177729586
      layer: algorithms
      does: [search]
      note: "Finding a root from noisy measurements with shrinking steps. The mathematical origin of stochastic gradient descent."

    - title: "A Note on Two Problems in Connexion with Graphs"
      by: Edsger Dijkstra
      year: 1959
      kind: paper
      url: https://doi.org/10.1007/BF01386390
      core: true
      layer: algorithms
      does: [search]
      builds_on:
        - "Solutio problematis ad geometriam situs pertinentis"
      note: "Shortest paths in three pages. Every route planner and weighted graph traversal still starts here."

    - title: "Some Studies in Machine Learning Using the Game of Checkers"
      by: Arthur Samuel
      year: 1959
      kind: paper
      url: https://doi.org/10.1147/rd.33.0210
      layer: learning
      does: [search]
      builds_on:
        - "Programming a Computer for Playing Chess"
