- id: crossroads
  title: Crossroads
  era: "where the threads meet"
  track: crossroads
  stack: classical
  blurb: >-
    Papers that connect stacks and layers: memory and attention, graphs and transformers, physics and learning,
    algorithms and the hardware they run on. Read these last; they make more sense then.
  items:
    - title: "More Is Different"
      by: Philip Anderson
      year: 1972
      kind: paper
      url: https://www.science.org/doi/10.1126/science.177.4047.393
      layer: physics
      does: []
      note: "New behaviour emerges at every scale. A useful lens for debates about emergence in LLMs."
      question: "Which LLM 'emergent' abilities survive a change of metric, and which are measurement artefacts?"

    - title: "A Neural Substrate of Prediction and Reward"
      by: Wolfram Schultz, Peter Dayan, Read Montague
      year: 1997
      kind: paper
      url: https://doi.org/10.1126/science.275.5306.1593
      core: true
      layer: learning
      does: [search]
      stack: brain
      builds_on:
        - "Learning to Predict by the Methods of Temporal Differences"
      note: "Dopamine neurons fire like the TD error from reinforcement learning. The cleanest meeting point of AI and neuroscience."
      question: "If the brain implements TD learning, what plays the role of the value function, and how is it represented?"

    - title: "Deep Learning with Coherent Nanophotonic Circuits"
      by: Yichen Shen et al.
      year: 2017
      kind: paper
      url: https://arxiv.org/abs/1610.02365
      layer: devices
      does: [compute]
      note: "Matrix multiplication with light. The photonic branch of AI hardware."
      question: "Is the bottleneck the multiply, or converting signals in and out of the optical domain?"

    - title: "Hopfield Networks is All You Need"
      by: Hubert Ramsauer et al.
      year: 2020
      kind: paper
      url: https://arxiv.org/abs/2008.02217
      core: true
      layer: learning
      does: [store, search]
      builds_on:
        - "Neural Networks and Physical Systems with Emergent Collective Computational Abilities"
        - "Attention Is All You Need"
      note: "Transformer attention is the update rule of a modern Hopfield network. Links 1982 to 2017."
      question: "What is stored, what changes during retrieval, and where is the energy function defined?"
      route: 22

    - title: "Transformers are Graph Neural Networks"
      by: Chaitanya Joshi
      year: 2020
      kind: essay
      url: https://thegradient.pub/transformers-are-graph-neural-networks/
      core: true
      layer: learning
      does: [move]
      builds_on:
        - "Attention Is All You Need"
        - "Neural Message Passing for Quantum Chemistry"
      note: "A sentence is a fully connected graph and attention is message passing. Connects the transformer and graph stages."
      question: "What is invariant to relabelling the tokens, and where does positional encoding deliberately break that symmetry?"

    - title: "The Hardware Lottery"
      by: Sara Hooker
      year: 2020
      kind: essay
      url: https://arxiv.org/abs/2009.06489
      core: true
      layer: architecture
      does: [compute]
      builds_on:
        - "The Bitter Lesson"
        - "Can Programming Be Liberated from the von Neumann Style?"
      note: "Ideas win when they suit the available hardware, not only when they are best. The counterweight to the Bitter Lesson."
      question: "Which ideas on this list lost because of hardware rather than merit, and what hardware would revive them?"

    - title: "Backpropagation and the Brain"
      by: Timothy Lillicrap et al.
      year: 2020
      kind: paper
      url: https://www.nature.com/articles/s41583-020-0277-3
      layer: learning
      does: [compute]
      stack: brain
      builds_on:
        - "Learning Representations by Back-Propagating Errors"
      note: "Could the brain approximate backprop? Where deep learning and neuroscience meet."
      question: "Which parts of backprop does a brain lack (weight transport, separate phases), and which approximations survive?"

    - title: "The Forward-Forward Algorithm"
      by: Geoffrey Hinton
      year: 2022
      kind: paper
      url: https://arxiv.org/abs/2212.13345
      layer: learning
      does: [compute]
      builds_on:
        - "Learning Representations by Back-Propagating Errors"
        - "A Learning Algorithm for Boltzmann Machines"
      note: "Learning without backprop, and the idea of 'mortal computation' on analog hardware that dies with its weights."
      question: "What does a learning rule need to run on hardware whose weights cannot be copied?"

    - title: "Deep Physical Neural Networks Trained with Backpropagation"
      by: Logan Wright et al.
      year: 2022
      kind: paper
      url: https://www.nature.com/articles/s41586-021-04223-6
      layer: physics
      does: [compute]
      builds_on:
        - "Learning Representations by Back-Propagating Errors"
      note: "Using physical systems (optics, mechanics, electronics) themselves as the network."
      question: "When does the physics do the computation for free, and when does noise make it unusable?"

