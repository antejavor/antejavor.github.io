      layer: algorithms
      does: [compute]
      builds_on:
        - "A Hierarchical O(N log N) Force-Calculation Algorithm"
      note: "The fast multipole method: O(N) with controlled error. Also one of the top 10 algorithms."

    - title: "What Every Computer Scientist Should Know About Floating-Point Arithmetic"
      by: David Goldberg
      year: 1991
      kind: paper
      url: https://doi.org/10.1145/103162.103163
      core: true
      layer: architecture
      does: [compute]
