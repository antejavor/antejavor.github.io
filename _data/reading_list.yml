      note: "The Metropolis algorithm, run on MANIAC: random search through physical states. Markov chain Monte Carlo begins."
      route: 31

    - title: "Studies of Nonlinear Problems"
      by: Enrico Fermi, John Pasta, Stanislaw Ulam, Mary Tsingou
      year: 1955
      kind: paper
      url: https://doi.org/10.2172/4376203
      layer: algorithms
      does: [compute]
      note: "The first computer experiment: a simulation that surprised its authors and started the study of nonlinear dynamics."

    - title: "An Algorithm for the Machine Calculation of Complex Fourier Series"
      by: James Cooley, John Tukey
