- id: physics
  title: Physics of computation
  era: "1929 – today"
  track: stack
  stack: classical
  blurb: >-
    The bottom of the stack. Information is physical: what it costs to erase a bit, how fast matter can compute,
    and how much room is left at the bottom and at the top.
  items:
    - title: "On the Decrease of Entropy in a Thermodynamic System by the Intervention of Intelligent Beings"
      by: Leo Szilard
      year: 1929
      kind: paper
      url: https://doi.org/10.1002/bs.3830090402
      layer: physics
      does: [store]
      note: "Maxwell's demon with one molecule: acquiring a bit of information has a thermodynamic price. Where information becomes physical."

    - title: "Information Theory and Statistical Mechanics"
      by: E. T. Jaynes
      year: 1957
      kind: paper
      url: https://doi.org/10.1103/PhysRev.106.620
      layer: physics
      does: [search]
      builds_on:
        - "A Mathematical Theory of Communication"
      note: "Statistical mechanics derived as inference from maximum entropy. Physics and information theory as one subject."
      question: "Where do softmax, Boltzmann distributions and energy-based models meet maximum entropy?"

    - title: "There's Plenty of Room at the Bottom"
      by: Richard Feynman
      year: 1959
      kind: essay
      url: https://web.pa.msu.edu/people/yang/RFeynman_plentySpace.pdf
      core: true
      layer: physics
      does: [compute, store]
      note: "Writing the encyclopedia on a pin head and computers built from atoms, imagined in 1959. The founding text of the miniaturization that followed."
      route: 10

    - title: "Irreversibility and Heat Generation in the Computing Process"
      by: Rolf Landauer
      year: 1961
      kind: paper
      url: https://ieeexplore.ieee.org/document/5392446
      core: true
      layer: physics
      does: [store]
      builds_on:
        - "On the Decrease of Entropy in a Thermodynamic System by the Intervention of Intelligent Beings"
        - "A Mathematical Theory of Communication"
      note: "Erasing a bit has a minimum energy cost. The physical limit under all of this, classical and quantum."
      question: "Which costs follow from the algorithm and which from the physical substrate?"
      route: 9

    - title: "Logical Reversibility of Computation"
      by: Charles Bennett
      year: 1973
      kind: paper
      url: https://doi.org/10.1147/rd.176.0525
      layer: physics
      does: [compute]
      builds_on:
        - "Irreversibility and Heat Generation in the Computing Process"
      note: "Any computation can be made reversible, and so, in principle, free of Landauer's cost. Quantum circuits must work this way."
      route: 43

    - title: "Conservative Logic"
      by: Edward Fredkin, Tommaso Toffoli
      year: 1982
      kind: paper
      url: https://doi.org/10.1007/BF01857727
      layer: physics
      does: [compute]
      builds_on:
        - "Logical Reversibility of Computation"
      note: "Reversible gates (Fredkin, Toffoli) that conserve information like physics conserves energy. The Toffoli gate is a quantum gate too."

    - title: "The Thermodynamics of Computation — A Review"
      by: Charles Bennett
      year: 1982
      kind: paper
      url: https://doi.org/10.1007/BF02084158
      layer: physics
      does: [compute]
      builds_on:
        - "Logical Reversibility of Computation"
        - "Irreversibility and Heat Generation in the Computing Process"
      note: "Reversible computation and Maxwell's demon. Links Landauer to quantum computing, whose gates are reversible."
      question: "If quantum gates are reversible, where in a quantum computer is energy actually spent?"

    - title: "Feynman Lectures on Computation"
      by: Richard Feynman
      year: 1996
      kind: book
      url: https://doi.org/10.1201/9780429500442
      core: true
      layer: physics
      does: [compute]
      builds_on:
        - "Conservative Logic"
        - "Simulating Physics with Computers"
        - "The Thermodynamics of Computation — A Review"
      note: "From logic gates and Turing machines to coding, reversible computing, the physics of computation and quantum computers, in Feynman's voice."

    - title: "The Maximum Speed of Dynamical Evolution"
      by: Norman Margolus, Lev Levitin
      year: 1998
      kind: paper
      url: https://arxiv.org/abs/quant-ph/9710043
      layer: physics
      does: [compute]
      note: "Energy bounds how fast any physical system can move between distinguishable states, and so how fast it can compute."

    - title: "Ultimate Physical Limits to Computation"
      by: Seth Lloyd
      year: 2000
      kind: paper
      url: https://doi.org/10.1038/35023282
      core: true
      layer: physics
      does: [compute, store]
      builds_on:
        - "The Maximum Speed of Dynamical Evolution"
        - "Irreversibility and Heat Generation in the Computing Process"
      note: "How many operations and bits a 1 kg, 1 litre 'laptop' could have, from energy, entropy and the speed of light."

    - title: "Information, Physics, and Computation"
      by: Marc Mézard, Andrea Montanari
      year: 2009
      kind: book
      url: https://doi.org/10.1093/acprof:oso/9780198570837.001.0001
      layer: physics
      does: [compute, search]
      builds_on:
        - "Information Theory and Statistical Mechanics"
        - "Error Detecting and Error Correcting Codes"
        - "The Complexity of Theorem-Proving Procedures"
      note: "Spin glasses, error-correcting codes, satisfiability and inference treated as one subject with the tools of statistical physics."

    - title: "Experimental Verification of Landauer's Principle Linking Information and Thermodynamics"
      by: Antoine Bérut et al.
      year: 2012
      kind: paper
      url: https://doi.org/10.1038/nature10872
      layer: physics
      does: [store]
      builds_on:
        - "Irreversibility and Heat Generation in the Computing Process"
      note: "Erasing one bit, held by a colloidal particle, measured to cost kT ln 2. Landauer's bound confirmed in the lab."

    - title: "Limits on Fundamental Limits to Computation"
      by: Igor Markov
      year: 2014
      kind: paper
      url: https://doi.org/10.1038/nature13570
      layer: physics
      does: [compute, move]
      builds_on:
        - "Ultimate Physical Limits to Computation"
      note: "An engineer's survey of which limits (energy, communication, manufacturing, design) actually bind first."

    - title: "A Coherent Ising Machine for 2000-Node Optimization Problems"
      by: Takahiro Inagaki et al.
      year: 2016
      kind: paper
      url: https://doi.org/10.1126/science.aah4243
      layer: physics
      does: [search]
      builds_on:
        - "Optimization by Simulated Annealing"
      note: "Pulses of laser light in a fibre loop find low-energy states of a 2000-spin problem. Physics as the search engine."

    - title: "The Stochastic Thermodynamics of Computation"
      by: David Wolpert
      year: 2019
      kind: paper
      url: https://arxiv.org/abs/1905.05669
      layer: physics
      does: [compute]
      builds_on:
        - "Irreversibility and Heat Generation in the Computing Process"
        - "The Thermodynamics of Computation — A Review"
      note: "The modern, non-equilibrium version of Landauer: the real thermodynamic cost of real computations."

