    - title: "In-Datacenter Performance Analysis of a Tensor Processing Unit"
      by: Norman Jouppi et al. (Google)
      year: 2017
      kind: paper
      url: https://arxiv.org/abs/1704.04760
      core: true
      layer: architecture
      does: [compute]
      builds_on:
        - "Why Systolic Architectures?"
        - "Roofline: An Insightful Visual Performance Model for Multicore Architectures"
      note: "The first TPU. A systolic array built for matrix multiplication, and the case for designing chips around one workload."
      route: 29

    - title: "Efficient Processing of Deep Neural Networks: A Tutorial and Survey"
      by: Vivienne Sze, Yu-Hsin Chen, Tien-Ju Yang, Joel Emer
      year: 2017
      kind: paper
      url: https://arxiv.org/abs/1703.09039
      layer: architecture
      does: [compute, move]
      builds_on:
