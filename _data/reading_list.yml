    - title: "NVIDIA Tesla: A Unified Graphics and Computing Architecture"
      by: Erik Lindholm et al.
      year: 2008
      kind: paper
      url: https://doi.org/10.1109/MM.2008.31
      layer: architecture
      does: [compute]
      builds_on:
        - "Very High-Speed Computing Systems"
      note: "The architecture that turned graphics cards into general-purpose parallel processors, and CUDA's foundation."

    - title: "Large-Scale Deep Unsupervised Learning Using Graphics Processors"
      by: Rajat Raina, Anand Madhavan, Andrew Ng
      year: 2009
      kind: paper
      url: https://dl.acm.org/doi/10.1145/1553374.1553486
      layer: architecture
      does: [compute]
      builds_on:
        - "NVIDIA Tesla: A Unified Graphics and Computing Architecture"
      note: "An early demonstration that GPUs speed up neural network training by around 70x."

    - title: "Roofline: An Insightful Visual Performance Model for Multicore Architectures"
      by: Samuel Williams, Andrew Waterman, David Patterson
      year: 2009
      kind: paper
      url: https://doi.org/10.1145/1498765.1498785
      core: true
      layer: architecture
      does: [compute, move]
      builds_on:
        - "Hitting the Memory Wall"
        - "Validity of the Single Processor Approach to Achieving Large Scale Computing Capabilities"
      note: "One chart that tells you whether a kernel is limited by compute or by memory bandwidth."

    - title: "Dark Silicon and the End of Multicore Scaling"
      by: Hadi Esmaeilzadeh et al.
      year: 2011
      kind: paper
      url: https://doi.org/10.1145/2000064.2000108
      layer: architecture
      does: [compute]
      builds_on:
        - "Design of Ion-Implanted MOSFET's with Very Small Physical Dimensions"
