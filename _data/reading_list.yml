# All the way down and around: every reading on the path, one entry each.
# Ordered by home: the chapters in _data/chapters.yml, then the branches in _data/branches.yml.
# Within a home: the start reading first, then by year, then prerequisites.
#
# fields:
#   title, by, year, kind (paper | book | course | essay | video | interactive), url
#   home: id         -> the chapter or branch this reading belongs to (exactly one)
#   prereq: true     -> background for its home, shown under "Refresh first"; not part of the walk
#   layer: ...       -> physics | devices | architecture | systems | algorithms | learning | intelligence
#   does: [...]      -> any of compute, store, move, search (empty for purely conceptual readings)
#   builds_on: [...] -> exact titles of earlier readings this one builds on; drawn as connections on the map
#   note             -> why it is on the list; the station's description
#   focus            -> a bounded reading or exercise; the station's task
#   question: "..."  -> a question to carry while reading
#   refs: [...]      -> further references, each {title, url, kind}; the work itself is always listed first
#   read: 2026-11-20 -> add when done; the walked line on the map follows these dates

