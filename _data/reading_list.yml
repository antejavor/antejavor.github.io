- id: architecture
  title: Architecture
  era: "1945 – today"
  track: stack
  stack: classical
  blurb: >-
    How devices are organized into machines: stored programs, caches, vectors, systolic arrays, GPUs and
    accelerators. Where compute meets the memory wall.
  items:
    - title: "First Draft of a Report on the EDVAC"
      by: John von Neumann
      year: 1945
      kind: paper
      url: https://doi.org/10.1109/85.238389
      core: true
      layer: architecture
      does: [compute, store]
      builds_on:
        - "On Computable Numbers, with an Application to the Entscheidungsproblem"
        - "A Logical Calculus of the Ideas Immanent in Nervous Activity"
      note: "The stored-program architecture, and the memory/compute split that neuromorphic chips are trying to undo. Note how much of it is phrased in terms of neurons."

    - title: "One-Level Storage System"
      by: Tom Kilburn et al.
      year: 1962
      kind: paper
      url: https://doi.org/10.1109/TEC.1962.5219356
      layer: architecture
      does: [store]
      builds_on:
        - "First Draft of a Report on the EDVAC"
      note: "The Atlas computer invents virtual memory: a small fast store pretending to be a large one."

    - title: "Slave Memories and Dynamic Storage Allocation"
      by: Maurice Wilkes
      year: 1965
      kind: paper
      url: https://doi.org/10.1109/PGEC.1965.264263
      layer: architecture
      does: [store]
      builds_on:
        - "One-Level Storage System"
      note: "Two pages that describe the cache."

    - title: "Very High-Speed Computing Systems"
      by: Michael Flynn
      year: 1966
      kind: paper
      url: https://doi.org/10.1109/PROC.1966.5273
      layer: architecture
      does: [compute]
      builds_on:
        - "First Draft of a Report on the EDVAC"
